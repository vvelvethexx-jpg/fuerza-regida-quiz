function result(){let counts=Array(10).fill(0);answers.forEach((a,i)=>counts[order[i].opts[a].t]++);let ranked=counts.map((v,t)=>({v,t})).sort((a,b)=>b.v-a.v||a.t-b.t);let seed=answers.reduce((n,a,i)=>(Math.imul(n,31)+order[i].opts[a].t+1)>>>0,7);let eligible=songs.filter(s=>!archive.test(s.name));let scored=eligible.map(s=>({...s,score:counts[s.t]*3+counts[s.secondary],tie:((Math.imul(seed^(s.i+1),2654435761)>>>0)%10000)})).sort((a,b)=>b.score-a.score||b.tie-a.tie);let winner=scored[0],url='https://open.spotify.com/search/'+encodeURIComponent('Fuerza Regida '+winner.name);let examples=order.map((q,i)=>q.opts[answers[i]]).filter(o=>o.t===winner.t||o.t===winner.secondary).slice(0,3);let max=ranked[0].v||1;app.innerHTML=`<section class="card"><p class="tag">Tu historia tiene una canción</p><div class="disc" style="animation:none"><span>FR</span></div><h1 class="gold">${esc(winner.name)}</h1><p class="tag">Fuerza Regida · ${traits[winner.t]}</p><h2>¿Por qué te salió esta canción?</h2><p>${descriptions[winner.t]} ${descriptions[winner.secondary]} Esta asociación es una interpretación creativa del quiz, no un análisis literal de la letra.</p><p>Entre tus elecciones destacan: ${examples.map(o=>'«'+esc(o.label)+'»').join(', ')}.</p><h3>Tu perfil musical</h3>${ranked.slice(0,5).map(r=>`<div class="meter"><div><span>${traits[r.t]}</span><span>${r.v} elecciones</span></div><div class="bar"><i style="width:${100*r.v/max}%"></i></div></div>`).join('')}<h3>También podrían acompañar tu historia</h3><p>${scored.slice(1,4).map(s=>esc(s.name)).join(' · ')}</p><div class="actions"><a class="btn" href="${url}" target="_blank" rel="noopener">Escuchar en Spotify ↗</a><button class="secondary" id="share">Compartir resultado</button><button class="secondary" onclick="start()">Repetir quiz</button><button class="secondary" onclick="home()">Inicio</button></div><p id="notice" role="status"></p></section>`;document.querySelector('#share').onclick=async()=>{let msg='Mi canción de Fuerza Regida es '+winner.name+' 🎵 ¿Cuál es la tuya?';try{if(navigator.share){await navigator.share({title:'Mi canción de Fuerza Regida',text:msg,...(location.protocol==='https:'?{url:location.href}:{})})}else{window.open('https://wa.me/?text='+encodeURIComponent(msg+(location.protocol==='https:'?' '+location.href:'')),'_blank','noopener')}}catch(e){document.querySelector('#notice').textContent='Puedes compartir tu resultado: '+msg}}}
function catalog(){app.innerHTML=`<section class="card"><button class="secondary" onclick="home()">← Inicio</button><h2>Catálogo musical</h2><p>${songs.length} títulos de referencia, agrupados sin versiones repetidas evidentes. Los temas de narrativa delicada se incluyen para consulta musical.</p><input id="find" placeholder="Buscar canción" style="width:100%;padding:15px;border-radius:8px;background:#242124;color:white;border:1px solid #a98a46"><div id="list"></div></section>`;let draw=()=>{let term=document.querySelector('#find').value.toLowerCase();document.querySelector('#list').innerHTML=songs.filter(s=>s.name.toLowerCase().includes(term)).sort((a,b)=>a.name.localeCompare(b.name)).map(s=>`<p><a style="color:#d4af37" target="_blank" rel="noopener" href="https://open.spotify.com/search/${encodeURIComponent('Fuerza Regida '+s.name)}">${esc(s.name)}</a>${archive.test(s.name)?' · consulta':''}</p>`).join('')};document.querySelector('#find').oninput=draw;draw()}home();</script></body></html>
