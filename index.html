ow:0 12px 28px #0009}.art small{display:block;position:relative;color:#bbb;margin-top:8px}.polaroid{width:90%;margin:16px auto 30px;display:block;border:7px solid #e8deda;transform:rotate(-3deg);box-shadow:0 14px 30px #0009}.bandstrip{display:block;width:100%;max-height:160px;object-fit:cover;object-position:center 40%;margin-top:26px;mask-image:linear-gradient(transparent,black 30%,black 80%,transparent);opacity:.8}.facts{display:grid;gap:12px;text-align:left;margin:25px auto;max-width:390px}.facts div{padding:12px;border-bottom:1px solid #492328}.facts b{color:#ff737b;margin-right:10px}.wave{display:flex;justify-content:center;align-items:center;gap:4px;height:30px;margin:20px 0 2px}.wave i{width:4px;background:#f12531;height:var(--h);animation:wave 1.3s infinite alternate;animation-delay:var(--d)}footer{font-size:11px;color:#b5a6a7;text-align:center;line-height:1.7}footer a{color:#ff777c}a{color:#ff777c}@keyframes wave{to{transform:scaleY(.35)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes appear{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@media(max-width:480px){main{padding:12px}.card{border-radius:17px}.home h1{font-size:clamp(35px,10vw,54px)}.nav button{padding:12px 16px}.actions>*{flex:1 1 100%}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

function home(){app.innerHTML=`<section class="card home"><img class="hero" src="${bandPhoto}" alt="Fotografía de los cinco integrantes de Fuerza Regida"><p class="tag">El quiz musical · Edición fan</p><h1>¿Qué canción de <em>Fuerza Regida</em> <strong>eres?</strong></h1><p class="slogan">Hay historias que no se cuentan, se cantan.</p><p>Descubre qué canción representa tu personalidad, tus sentimientos y tu historia.</p><button onclick="intro()">▷ INICIAR QUIZ</button>${wave()}<p class="tag">30 preguntas · ${songs.length} temas de referencia</p><button class="secondary" onclick="catalog()">Explorar catálogo musical</button></section>`}
function intro(){app.innerHTML=`<section class="card center"><img class="polaroid" src="${bandPhoto}" alt="Los cinco integrantes de Fuerza Regida"><h2>30 PREGUNTAS</h2><div class="facts"><div><b>◷</b> Duración aproximada: 5–8 minutos</div><div><b>♫</b> Resultados con canciones de Fuerza Regida</div><div><b>◎</b> Basado en tus elecciones, vivencias y estilo</div></div><p>No hay respuestas correctas ni incorrectas.</p><button onclick="start()">COMENZAR →</button><p><button class="secondary" onclick="home()">← Volver</button></p></section>`}
function start(){order=shuffle(Q.map(q=>({q:q[0],opts:shuffle(q.slice(1).map(o=>({label:o.slice(0,o.lastIndexOf(':')),t:+o.slice(o.lastIndexOf(':')+1)})))})));answers=Array(order.length).fill(null);pos=0;render()}
function render(){let q=order[pos];app.innerHTML=`<section class="card"><p class="tag">Pregunta ${pos+1} / ${order.length}</p><div class="bar"><i style="width:${100*answers.filter(x=>x!==null).length/order.length}%"></i></div><h2>${esc(q.q)}</h2><div class="options">${q.opts.map((o,i)=>`<button class="${answers[pos]===i?'selected':''}" aria-pressed="${answers[pos]===i}" onclick="choose(${i})"><span class="letter">${String.fromCharCode(65+i)}</span> ${esc(o.label)}</button>`).join('')}</div><div class="nav"><button class="secondary" onclick="back()">← Anterior</button><button ${answers[pos]===null?'disabled':''} onclick="next()">${pos===order.length-1?'REVELAR MI CANCIÓN':'Siguiente →'}</button></div><img class="bandstrip" src="${bandPhoto}" alt=""></section>`}function choose(i){answers[pos]=i;render()}function back(){if(pos>0){pos--;render()}else home()}function next(){if(answers[pos]===null)return;if(pos<order.length-1){pos++;render()}else{app.innerHTML='<section class="card center"><p class="tag">Tu historia tiene una canción</p><div class="disc"><span>FR</span></div><h2>Encontrando tu corrido…</h2><p>Conectando tus respuestas con el catálogo musical.</p></section>';setTimeout(result,1200)}}
const descriptions=['Te atraen los vínculos cercanos y los detalles que hacen especial una historia.','Los recuerdos y las experiencias compartidas tienen un lugar importante en tus elecciones.','Prefieres aprender de los retos y seguir construyendo tu camino.','Te entusiasman los proyectos, las metas y las posibilidades de crecimiento.','Valoras actuar con autenticidad y mantener tus propios límites.','Disfrutas explorar posibilidades y escribir tu historia a tu manera.','Te gustan los momentos espontáneos, la música y compartir alegría.','Das importancia a la confianza y a estar presente para las personas cercanas.','Tus elecciones reflejan aprecio por los orígenes, la familia y las tradiciones.','Te atrae comprender tus experiencias y tomar decisiones con calma.'];
function result(){let counts=Array(10).fill(0);answers.forEach((a,i)=>counts[order[i].opts[a].t]++);let ranked=counts.map((v,t)=>({v,t})).sort((a,b)=>b.v-a.v||a.t-b.t);let seed=order.map((q,i)=>[q.q,q.opts[answers[i]].label]).sort((a,b)=>a[0].localeCompare(b[0])).flat().join("|").split("").reduce((n,c)=>(Math.imul(n,31)+c.charCodeAt(0))>>>0,7);let eligible=songs.filter(s=>!archive.test(s.name));let scored=eligible.map((s,k)=>({...s,score:counts[s.t]*3+counts[s.secondary],tie:((Math.imul(seed^(k+1),2654435761)>>>0)%10000)})).sort((a,b)=>b.score-a.score||b.tie-a.tie);let winner=scored[0],url='https://open.spotify.com/search/'+encodeURIComponent('Fuerza Regida '+winner.name);let examples=order.map((q,i)=>q.opts[answers[i]]).filter(o=>o.t===winner.t||o.t===winner.secondary).slice(0,3);let max=ranked[0].v||1;app.innerHTML=`<section class="card"><p class="tag">Tu historia tiene una canción</p><div class="art"><div class="disc"><span>FR</span></div><img class="cover" src="${graphic}" alt="Gráfico temático de corazón cromado"><small>Arte temático · no es la portada del resultado</small></div><h1 class="gold">${esc(winner.name)}</h1><p class="tag">Fuerza Regida · ${traits[winner.t]}</p><h2>¿Por qué te salió esta canción?</h2><p>${descriptions[winner.t]} ${descriptions[winner.secondary]} Esta asociación es una interpretación creativa del quiz, no un análisis literal de la letra.</p><p>Entre tus elecciones destacan: ${examples.map(o=>'«'+esc(o.label)+'»').join(', ')}.</p><h3>Tu perfil musical</h3>${ranked.slice(0,5).map(r=>`<div class="meter"><div><span>${traits[r.t]}</span><span>${r.v} elecciones</span></div><div class="bar"><i style="width:${100*r.v/max}%"></i></div></div>`).join('')}<h3>También podrían acompañar tu historia</h3><p>${scored.slice(1,4).map(s=>esc(s.name)).join(' · ')}</p><div class="actions"><a class="btn" href="${url}" target="_blank" rel="noopener">Escuchar en Spotify ↗</a><button class="secondary" id="share">Compartir resultado</button><button class="secondary" onclick="start()">Repetir quiz</button><button class="secondary" onclick="home()">Inicio</button></div><p id="notice" role="status"></p></section>`;document.querySelector('#share').onclick=async()=>{let msg='Mi canción de Fuerza Regida es '+winner.name+' 🎵 ¿Cuál es la tuya?';try{if(navigator.share){await navigator.share({title:'Mi canción de Fuerza Regida',text:msg,...(location.protocol==='https:'?{url:location.href}:{})})}else{window.open('https://wa.me/?text='+encodeURIComponent(msg+(location.protocol==='https:'?' '+location.href:'')),'_blank','noopener')}}catch(e){document.querySelector('#notice').textContent='Puedes compartir tu resultado: '+msg}}}
function catalog(){app.innerHTML=`<section class="card"><button class="secondary" onclick="home()">← Inicio</button><h2>Catálogo musical</h2><p>${songs.length} títulos de referencia, agrupados sin versiones repetidas evidentes. Los temas de narrativa delicada se incluyen para consulta musical.</p><input id="find" placeholder="Buscar canción" style="width:100%;padding:15px;border-radius:8px;background:#201216;color:white;border:1px solid #754044"><div id="list"></div></section>`;let draw=()=>{let term=document.querySelector('#find').value.toLowerCase();document.querySelector('#list').innerHTML=songs.filter(s=>s.name.toLowerCase().includes(term)).sort((a,b)=>a.name.localeCompare(b.name)).map(s=>`<p><a style="color:#ff777c" target="_blank" rel="noopener" href="https://open.spotify.com/search/${encodeURIComponent('Fuerza Regida '+s.name)}">${esc(s.name)}</a>${archive.test(s.name)?' · consulta':''}</p>`).join('')};document.querySelector('#find').oninput=draw;draw()}home();</script></body></html>
